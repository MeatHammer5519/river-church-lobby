<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>River Church Lobby</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

#slide {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
  opacity: 1;
  transition: opacity 0.8s ease-in-out;
}
  </style>
</head>

<body>

<img id="slide" src="Welcome.png">

<script>
var slides = [
  "Welcome.png",
  "Give.png",
  "Harvest%20party.png",
  "Vision%20Statement.png",
  "Small%20Groups.png",
  "Give.png",
  "Update.png",
  "Mission.png",
  "Overflow.png"
];

  var currentSlide = 0;
  var slide = document.getElementById("slide");

function nextSlide() {
  slide.style.opacity = 0;

  setTimeout(function() {
    currentSlide = (currentSlide + 1) % slides.length;
    slide.src = slides[currentSlide];
    slide.style.opacity = 1;
  }, 800);
}
  
  setInterval(nextSlide, 7000);


// Reload the page once every 24 hours
setInterval(function() {
  location.reload(true);
}, 86400000);

</script>

</body>
</html>
