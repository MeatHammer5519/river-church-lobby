<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Church Lobby</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

<video
  id="lobbyVideo"
  autoplay
  muted
  loop
  playsinline
  style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: black;"
>
  <source src="Copy%20of%20Blessed%20Sermon%20Series.mp4" type="video/mp4">
</video>
  
<script>
  function scheduleSundayRefresh() {
    const now = new Date();
    const next = new Date(now);

    // Next Sunday at 5:00 AM
    let daysUntilSunday = (7 - now.getDay()) % 7;

    next.setDate(now.getDate() + daysUntilSunday);
    next.setHours(5, 0, 0, 0);

    // If it's already past 5 AM Sunday, schedule next Sunday
    if (next <= now) {
      next.setDate(next.getDate() + 7);
    }

    const delay = next.getTime() - now.getTime();

    setTimeout(function () {
      location.reload();
    }, delay);
  }

  scheduleSundayRefresh();
</script>
</body>
</html>
