<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>River Church Lobby</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

#slide {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}
  </style>
</head>

<body>

<img id="slide" src="Welcome.png">

<script>
var slides = [
  "Welcome.png",
  "Give.png",
  "Harvest%20party.png",
  "Vision%20Statement.png",
  "Small%20Groups.png",
  "Give.png",
  "Update.png",
  "Mission.png",
  "Overflow.png"
];

  var currentSlide = 0;
  var slide = document.getElementById("slide");

function nextSlide() {
  currentSlide = (currentSlide + 1) % slides.length;
  slide.src = slides[currentSlide];
}
  
  setInterval(nextSlide, 7000);


  // Reload the page every Sunday shortly after 5:00 AM
  // so newly uploaded slides are picked up.

  var lastRefreshDate = "";

  setInterval(function() {

    var now = new Date();

    if (
      now.getDay() === 0 &&
      now.getHours() === 5 &&
      now.getMinutes() < 5
    ) {

      var today =
        now.getFullYear() + "-" +
        now.getMonth() + "-" +
        now.getDate();

      if (lastRefreshDate !== today) {
        lastRefreshDate = today;
        location.reload(true);
      }
    }

  }, 60000);

</script>

</body>
</html>
